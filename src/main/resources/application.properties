# --- Server ---
server.port=8080

# --- PostgreSQL connection ---
# Create the DB first: createdb tasktracker  (or via psql: CREATE DATABASE tasktracker;)
spring.datasource.url=jdbc:postgresql://localhost:5432/tasktracker
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update' is convenient for local dev; use migrations (Flyway/Liquibase) in real projects
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
